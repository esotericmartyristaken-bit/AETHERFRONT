// Scatterer owns the local shadow renderer when it is installed. Kopernicus's
// fallback shadow manager also replaces the collector and cascade splits; running
// both leaves scene initialization order controlling which settings are active.
// Potato installations without Scatterer retain Kopernicus's normal fallback.
@Kopernicus_config:NEEDS[scatterer]:FINAL
{
    %EnableKopernicusShadowManager = false
}

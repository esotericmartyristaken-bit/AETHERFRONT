// This marker describes only this profile; it must not advertise other mods.
KESAS_POTATO_COMPAT
{
    enabled = true
}

// Keep physics and fuel-switch modifiers. Remove only references to the
// Waterfall renderer that this profile deliberately removes below.
@PART[*]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER[ModuleWaterfallFX]] {}
        }
    }

    // Potato retains StockWaterfallEffects rules, but not its plume models.
    // These are supplementary visual models, not the engine's main model.
    !MODEL:HAS[#model[StockWaterfallEffects/*]] {}

    !MODULE[ModuleWaterfallFX],* {}
    !EFFECTS,* {}
    !fx_* = DELETE
    !sound_* = DELETE
    @MODULE[ModuleEnginesFX],*
    {
        %runningEffectName =
        %powerEffectName =
        %directThrottleEffectName =
        %engageEffectName =
        %disengageEffectName =
        %flameoutEffectName =
    }
    @MODULE[ModuleRCSFX],*
    {
        %runningEffectName =
    }
}

// Interstellar Technologies embeds these optional lighting modules directly.
// Keep them whenever either supported EngineLight provider is installed.
@PART[*]:HAS[@MODULE[EngineLightEffect]]:NEEDS[!EngineLightRelit,!EngineLight]:FINAL
{
    !MODULE[EngineLightEffect],* {}
}

// This controller is supplied by KSPCommunityFixes, not ReStock.
// HarmonyKSP restores KSPCommunityFixes loading in both current profiles.
// Never remove the controller merely because a renderer is absent.
@PART[*]:HAS[@MODULE[RetractableLadderLightController]]:NEEDS[!KSPCommunityFixes]:FINAL
{
    !MODULE[RetractableLadderLightController],* {}
}

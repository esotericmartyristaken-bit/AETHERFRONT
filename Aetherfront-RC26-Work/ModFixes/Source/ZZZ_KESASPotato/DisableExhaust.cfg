// This marker describes only this profile; it must not advertise other mods.
KESAS_POTATO_COMPAT
{
    enabled = true
}

// Remove renderer references, never fuel/physics switches or their identifiers.
@PART[*]:FINAL
{
    @MODULE[ModuleB9PartSwitch],*
    {
        @SUBTYPE,*
        {
            !MODULE:HAS[@IDENTIFIER[ModuleWaterfallFX]] {}
        }
    }

    // Supplementary plume models only, not the engine's main model.
    !MODEL:HAS[#model[StockWaterfallEffects/*]] {}
    !MODULE[ModuleWaterfallFX],* {}

    // Keep named effect groups and module effect-name fields for lookups and
    // B9 identifiers. Empty groups instantiate no particle/audio components.
    @EFFECTS,*
    {
        @*,*
        {
            !*,* {}
            !* = DELETE
        }
    }
    !fx_* = DELETE
    !sound_* = DELETE
}
